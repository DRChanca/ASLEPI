    }

      font-size: 1.8rem;
      color: #1a3a5c;
    }

    .quiz-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .quiz-section {
      max-width: 820px;
      margin: 0 auto 28px;
    }

    .section-title {
      color: #1a3a5c;
      margin-bottom: 14px;
      font-size: 1.3rem;
    }

    .question-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      padding: 20px 24px;
    }

    .question-number {
      font-size: .8rem;
      font-weight: 600;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .question-img {
      display: block;
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin: 0 auto 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 7px;
      border: 1.5px solid #d0d7e2;
      transition: background .15s, border-color .15s;
      line-height: 1.4;
    }

    .option-label:hover { background: #eef3fa; border-color: #90aed4; }

    .option-label input[type="radio"] {
      margin-top: 3px;
      accent-color: #2563eb;
      flex-shrink: 0;
    }

    .option-label.correct {
      background: #d1fae5;
      border-color: #059669;
      color: #065f46;
    }

    .option-label.incorrect {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }

    .option-label.reveal-correct {
      background: #d1fae5;
      border-color: #059669;
      color: #065f46;
    }

    .btn {
      display: inline-block;
      padding: 9px 22px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
      transition: background .2s;
    }

    .btn-check {
      background: #2563eb;
      color: #fff;
    }
    .btn-check:hover { background: #1d4ed8; }
    .btn-check:disabled { background: #93afd8; cursor: default; }

    .btn-reveal {
      background: #7c3aed;
      color: #fff;
    }
    .btn-reveal:hover { background: #6d28d9; }
    .btn-reveal:disabled { background: #b59de0; cursor: default; }

    .feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 7px;
      font-weight: 600;
      display: none;
    }

    .feedback.show { display: block; }
    .feedback.ok  { background: #d1fae5; color: #065f46; }
    .feedback.ko  { background: #fee2e2; color: #7f1d1d; }
    .feedback.info { background: #ede9fe; color: #3b0764; }

    .reveal-answer-box {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 7px;
      background: #ede9fe;
      color: #3b0764;
      border: 1.5px solid #a78bfa;
      display: none;
      line-height: 1.5;
    }
    .reveal-answer-box.show { display: block; }

    .top-bar {
      max-width: 820px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .score-display {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a3a5c;
      background: #fff;
      border-radius: 8px;
      padding: 10px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .shuffle-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-shuffle {
      background: #0ea5e9;
      color: #fff;
    }
    .btn-shuffle:hover { background: #0284c7; }

    .final-score {
      max-width: 820px;
      margin: 8px auto 24px;
      padding: 18px 24px;
      border-radius: 10px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      display: none;
    }
    .final-score.show { display: block; }
    .final-score.great  { background: #d1fae5; color: #065f46; border: 2px solid #059669; }
    .final-score.ok     { background: #fef9c3; color: #713f12; border: 2px solid #ca8a04; }
    .final-score.poor   { background: #fee2e2; color: #7f1d1d; border: 2px solid #dc2626; }
  </style>
</head>

// ── Helpers ──────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── State ────────────────────────────────────────────────────────────────────
let displayPreguntatorQuestions = preguntatorQuestions.slice();
let displayWuolahQuestions = wuolahQuestions.slice();
let displayExamenesResueltosQuestions = examenesResueltosQuestions.slice();
const preguntatorMCTotal = preguntatorQuestions.filter(q => q.options).length;
const wuolahMCTotal = wuolahQuestions.filter(q => q.options).length;
const examenesResueltosMCTotal = examenesResueltosQuestions.filter(q => q.options).length;
const totalMCTotal = preguntatorMCTotal + wuolahMCTotal + examenesResueltosMCTotal;
let scoreCorrect = 0;
let scoreAnswered = 0;
let scoreMCTotal = totalMCTotal;

function updateScoreBar() {
  document.getElementById('scoreCorrect').textContent = scoreCorrect;
  document.getElementById('scoreTotal').textContent = scoreMCTotal;
}

function checkFinished() {
  if (scoreAnswered < scoreMCTotal) return;
  const box = document.getElementById('finalScore');
  const pct = scoreMCTotal > 0 ? scoreCorrect / scoreMCTotal : 0;
  let cls, emoji;
  if (pct >= 0.8)      { cls = 'great'; emoji = '🏆'; }
  else if (pct >= 0.5) { cls = 'ok';    emoji = '👍'; }
  else                 { cls = 'poor';  emoji = '📚'; }
  box.className = `final-score show ${cls}`;
  box.textContent = `${emoji} Resultado final: ${scoreCorrect} / ${scoreMCTotal} correctas (${Math.round(pct * 100)}%)`;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── Build DOM ────────────────────────────────────────────────────────────────
function renderQuestionSection(containerId, sectionName, questionsList) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  questionsList.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    const num = document.createElement('div');
    num.className = 'question-number';
    num.textContent = `Pregunta ${idx + 1} de ${questionsList.length} · ${sectionName}`;
    card.appendChild(num);

    const qtxt = document.createElement('div');
    qtxt.className = 'question-text';
    qtxt.textContent = q.text;
    card.appendChild(qtxt);

    if (q.image) {
      const img = document.createElement('img');
      img.src = q.image;
      img.alt = `Imagen de la pregunta ${idx + 1}`;
      img.className = 'question-img';
      card.appendChild(img);
    }

    const isOpen = !q.options;

    if (isOpen) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-reveal';
      btn.textContent = 'Mostrar respuesta';
      const answerBox = document.createElement('div');
      answerBox.className = 'reveal-answer-box';
      answerBox.textContent = q.answer;
      btn.addEventListener('click', () => {
        answerBox.classList.add('show');
        btn.disabled = true;
      });
      card.appendChild(btn);
      card.appendChild(answerBox);
    } else {
      const name = `${containerId}-q${idx}`;
      const optDiv = document.createElement('div');
      optDiv.className = 'options';

      q.options.forEach(opt => {
        const label = document.createElement('label');
        label.className = 'option-label';
        label.dataset.label = opt.label;

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = name;
        radio.value = opt.label;

        label.appendChild(radio);
        label.appendChild(document.createTextNode(`${opt.label.toUpperCase()}. ${opt.text}`));
        optDiv.appendChild(label);
      });

      card.appendChild(optDiv);

      const btn = document.createElement('button');
      btn.className = 'btn btn-check';
      btn.textContent = 'Comprobar';

      const feedback = document.createElement('div');
      feedback.className = 'feedback';

      btn.addEventListener('click', () => {
        const selected = optDiv.querySelector(`input[name="${name}"]:checked`);
        if (!selected) {
          feedback.className = 'feedback show info';
          feedback.textContent = '⚠️ Selecciona una opción antes de comprobar.';
          return;
        }

        optDiv.querySelectorAll('input').forEach(r => r.disabled = true);
        btn.disabled = true;

        const isCorrect = selected.value === q.correct;
        const selectedLabel = optDiv.querySelector(`label[data-label="${selected.value}"]`);
        const correctLabel  = optDiv.querySelector(`label[data-label="${q.correct}"]`);

        selectedLabel.classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) correctLabel.classList.add('reveal-correct');

        feedback.className = `feedback show ${isCorrect ? 'ok' : 'ko'}`;
        if (isCorrect) {
          feedback.textContent = '✅ ¡Correcto!';
          scoreCorrect++;
        } else {
          const correctOpt = q.options.find(o => o.label === q.correct);
          feedback.textContent = `❌ Incorrecto. La respuesta correcta es: ${q.correct.toUpperCase()}. ${correctOpt.text}`;
        }
        scoreAnswered++;
        updateScoreBar();
        checkFinished();
      });

      card.appendChild(btn);
      card.appendChild(feedback);
    }

    container.appendChild(card);
  });
}

function renderQuiz() {
  scoreCorrect = 0;
  scoreAnswered = 0;
  updateScoreBar();

  const finalBox = document.getElementById('finalScore');
  finalBox.className = 'final-score';
  finalBox.textContent = '';
  renderQuestionSection('preguntatorContainer', 'Preguntator', displayPreguntatorQuestions);
  renderQuestionSection('wuolahContainer', 'Wuolah', displayWuolahQuestions);
  renderQuestionSection('examenesResueltosContainer', 'Exámenes resueltos', displayExamenesResueltosQuestions);
}

// ── Shuffle buttons ───────────────────────────────────────────────────────────
document.getElementById('btnShuffleAnswers').addEventListener('click', () => {
  displayPreguntatorQuestions = displayPreguntatorQuestions.map(q => {
    if (!q.options) return q;
    const shuffledOpts = shuffle(q.options);
    return { ...q, options: shuffledOpts };
  });
  displayWuolahQuestions = displayWuolahQuestions.map(q => {
    if (!q.options) return q;
    const shuffledOpts = shuffle(q.options);
    return { ...q, options: shuffledOpts };
  });
  displayExamenesResueltosQuestions = displayExamenesResueltosQuestions.map(q => {
    if (!q.options) return q;
    const shuffledOpts = shuffle(q.options);
    return { ...q, options: shuffledOpts };
  });
  renderQuiz();
});

document.getElementById('btnShuffleQuestions').addEventListener('click', () => {
  displayPreguntatorQuestions = shuffle(displayPreguntatorQuestions);
  displayWuolahQuestions = shuffle(displayWuolahQuestions);
  displayExamenesResueltosQuestions = shuffle(displayExamenesResueltosQuestions);
  renderQuiz();
});
